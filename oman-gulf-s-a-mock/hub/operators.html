<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Operators &amp; certificates — Oman Gulf E-Invoicing Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/app.css">
<style>
/* page-local — OTA positions */
.otatag {
  display: inline-flex; align-items: center; gap: 6px; max-width: 100%;
  font-size: 12px; font-weight: 600; letter-spacing: .02em; line-height: 1.35;
  padding: 4px 10px; border-radius: var(--r-sm); white-space: normal;
  color: var(--warn); background: color-mix(in srgb, var(--warn) 12%, transparent);
  border: 1px solid color-mix(in srgb, var(--warn) 34%, transparent);
}
.otatag svg { width: 13px; height: 13px; flex: none; }
.pcard { margin-bottom: 16px; }
.pcard .card-head { align-items: flex-start; gap: 14px; flex-wrap: wrap; }
.pcard h3 { font-family: var(--font-cond, inherit); font-size: 18px; font-weight: 700; margin-top: 2px; line-height: 1.25; }
.plabel { font-size: 11.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--text-lo); margin-bottom: 5px; }
.basis { font-size: 14.5px; line-height: 1.55; }
.treat { margin: 6px 0 0; padding-left: 20px; }
.treat li { font-size: 14.5px; line-height: 1.55; margin-bottom: 7px; }
.treat li:last-child { margin-bottom: 0; }
.pblock + .pblock { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--line); }
.channels { font-size: 13.5px; line-height: 1.5; color: var(--text-mid); }
.exgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.exminor { font-size: 13px; color: var(--text-mid); line-height: 1.5; }
.exrows { display: grid; grid-template-columns: 1fr auto; gap: 6px 16px; margin: 10px 0; }
.exrows .k { font-size: 13.5px; color: var(--text-mid); }
.exrows .v { font-size: 14px; font-variant-numeric: tabular-nums; text-align: right; font-weight: 600; }
.exrows .v.big { font-size: 15.5px; }
@media (max-width: 760px) { .exgrid { grid-template-columns: 1fr; } }
</style>
</head>
<body class="surface-hub" data-surface="hub" data-nav="operators"
      data-step="hub-operators"
      data-crumbs="OTA positions / Operators &amp; certificates"
      data-hint="Invoicing oil and gas operators: when a certificate triggers the invoice, the PO, contract and service-entry references they usually require, and a hold if relief is claimed. To confirm with the OTA.">

<main class="main">
  <div class="page">

    <div class="page-head">
      <div class="grow">
        <div class="page-title">
          <h1>Invoicing oil and gas operators</h1>
          <span class="pill pill-warn"><i class="dot"></i>To confirm</span>
        </div>
        <p class="page-sub" id="page-sub"></p>
      </div>
    </div>

    <div id="frame" class="mb16"></div>

    <section>
      <div class="section-head">
        <div class="grow">
          <div class="eyebrow">Recommended positions</div>
          <h2>What Fawtara takes to the OTA</h2>
        </div>
        <span class="small dim">Two readings, both to confirm</span>
      </div>
      <div id="positions"></div>
    </section>

    <section>
      <div class="section-head">
        <div class="grow">
          <div class="eyebrow">Mapping to PINT-OM fields</div>
          <h2>What an operator usually needs on the invoice</h2>
        </div>
      </div>
      <div id="example"></div>
    </section>

    <div id="closing" class="mt24"></div>

  </div>
</main>

<script src="../assets/js/data.js"></script>
<script src="../assets/js/ui.js"></script>
<script src="../assets/js/shell.js"></script>
<script>
(function () {

  function positionCard(p) {
    var lis = p.treatment.map(function (t) { return '<li>' + t + '</li>'; }).join('');
    return '<div class="card pcard">' +
      '<div class="card-head">' +
        '<div class="grow">' +
          '<div class="eyebrow">Agenda · ' + p.agenda + '</div>' +
          '<h3>' + p.headline + '</h3>' +
        '</div>' +
        '<span class="otatag">' + icon('clock', 'otatag-ico') + p.tag + '</span>' +
      '</div>' +
      '<div class="card-body">' +
        '<div class="pblock">' +
          '<div class="plabel">Basis</div>' +
          '<div class="basis">' + p.basis + '</div>' +
        '</div>' +
        '<div class="pblock">' +
          '<div class="plabel">How Fawtara reads the treatment</div>' +
          '<ol class="treat">' + lis + '</ol>' +
        '</div>' +
        '<div class="pblock">' +
          '<div class="plabel">Across channels</div>' +
          '<div class="channels">' + p.channels + '</div>' +
        '</div>' +
      '</div>' +
    '</div>';
  }

  function pos(id) { return OTA_POSITIONS.filter(function (p) { return p.id === id; })[0]; }

  /* framing — a position brought to the meeting, not a settled rule */
  document.getElementById('frame').innerHTML = teach(
    'Oil and gas operators are the likely customers of a contractor like Oman Gulf, but which customers it has, and what each requires, is a discovery question. ' +
    'Certificate timing and any VAT relief an operator might claim are not settled for e-invoicing. What follows is ' +
    '<strong>Fawtara&rsquo;s recommended reading</strong> — a position to bring to the OTA, not a ruling. ' +
    'Each carries the amber <em>to confirm with OTA</em> tag until it is agreed.');

  document.getElementById('positions').innerHTML =
    positionCard(pos('certificate')) + positionCard(pos('operators'));

  var inv = INVOICES[0];
  var buyer = CUSTOMERS[inv.cust];
  var C = CONTRACT;
  var refs = [
    ['Customer PO', 'BT-13', 'Purchase order reference', C.po],
    ['Contract number', 'BT-12', 'Contract reference', C.no],
    ['Certificate number', 'BT-14', 'Sales order reference · field to confirm', C.certificate.no],
    ['Service-entry number', 'BT-15', 'Receiving advice reference · field to confirm', 'SES-IPC07-2026'],
    ['Certificate period', 'BT-73 / BT-74', 'Invoicing period start and end', '2026-10-01 → 2026-10-31']
  ];
  var refRows = refs.map(function (r) {
    return '<div class="k">' + r[0] + '</div><div class="v">' + r[3] + '</div><div class="k" style="grid-column:1 / -1;margin-top:-4px;font-size:12px"><span class="mono">' + r[1] + '</span> · ' + r[2] + '</div>';
  }).join('');

  document.getElementById('example').innerHTML =
    '<div class="exgrid">' +
      '<div class="card">' +
        '<div class="card-head">' +
          '<div class="grow"><div class="eyebrow">Carried from the finance system</div>' +
            '<h3 style="font-size:16px;font-weight:700;margin-top:2px">References on ' + inv.no + '</h3></div>' +
          '<span class="chip warn">Field choice · to confirm</span>' +
        '</div>' +
        '<div class="card-body">' +
          '<div class="exminor">An operator typically matches a supplier invoice to its own PO, contract and service-entry record before paying. ' +
            'Customer: <strong>' + buyer.name + '</strong> (fictional). This is a general industry pattern, not a confirmed Oman Gulf requirement.</div>' +
          '<div class="exrows">' + refRows + '</div>' +
          '<div class="exminor">The exact PINT-OM field for each reference is checked against the field list during mapping.</div>' +
        '</div>' +
      '</div>' +
      '<div class="card">' +
        '<div class="card-head">' +
          '<div class="grow"><div class="eyebrow">The control</div>' +
            '<h3 style="font-size:16px;font-weight:700;margin-top:2px">If a customer claims relief</h3></div>' +
          '<span class="pill pill-idle"><i class="dot"></i>Hold until evidence</span>' +
        '</div>' +
        '<div class="card-body">' +
          '<div class="exminor">This mock does <strong>not</strong> say that any relief exists for any customer. It shows what the Hub does if one is claimed: ' +
            'the document waits at the Collect stage, and nothing is sent on an assumption.</div>' +
          '<div class="exrows">' +
            '<div class="k">Default</div><div class="v">Standard rate · 5%</div>' +
            '<div class="k">Relief claimed by customer</div><div class="v">Hold document</div>' +
            '<div class="k">Evidence attached and archived</div><div class="v">Released</div>' +
            '<div class="k">Which evidence is acceptable</div><div class="v">To confirm with OTA</div>' +
          '</div>' +
          '<div class="exminor">Whether any Oman Gulf customer claims relief under its own concession or contract is question 8 in the discovery list.</div>' +
        '</div>' +
      '</div>' +
    '</div>';

  document.getElementById('page-sub').innerHTML =
    'Fawtara&rsquo;s reading: the approved certificate triggers the invoice; supplies to operators are standard-rated unless evidence is attached; ' +
    'and the references an operator needs travel in PINT-OM fields. All to confirm with the OTA.';

  document.getElementById('closing').innerHTML = notice('warn',
    '<strong>Nothing on this screen is a settled rule.</strong> It is the position Fawtara recommends and will put ' +
    'to the OTA. If the Authority reads certificate timing or relief evidence differently, the release rule ' +
    'and the mapping both change.');

})();
</script>
</body>
</html>
